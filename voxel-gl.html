/* JARJS OpenGL → WebGL 运行时 (v0.3 - 含现代可编程管线)

 * 1. 完整保持固定管线内置 Shader 和图元绘制后端（GL 1.1 语义）
 * 2. 纯增量提供现代管线桥接（GL 2.0 / 1.5 / 1.4 / 1.3 / 3.0：Shader, Program, Uniform, Attrib, VBO, FBO）
 * 3. 桌面 GLSL 自动预处理

(function () {
  'use strict';

  var G = {};
  window.JARJS_GL = G;

  var canvas = null;
  var gl = null;
  var prog = null;
  var loc = {};

  var keys = {};
  var keyQueue = [];
  var mouse = { x: 0, y: 0, dx: 0, dy: 0, buttons: {}, queue: [], grabbed: false };
  var closeRequested = false;
  var lost = false;

  // ---------- 固定管线内置着色器 ----------
  var VS = [
    'attribute vec3 aPos;',
    'attribute vec4 aColor;',
    'attribute vec2 aUV;',
    'uniform mat4 uMVP;',
    'varying vec4 vColor;',
    'varying vec2 vUV;',

    '  vColor = aColor;',
    '  vUV = aUV;',
    '}'

    'uniform float uUseTex;',

    'varying vec2 vUV;',
